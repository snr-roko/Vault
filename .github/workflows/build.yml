name: Vault CI/CD Workflow

on:
  pull_request:
    branches:
      - master

jobs:
  vault-simple-workflow:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Announce Pull Request
        run: >
          curl -X POST -H 'Content-type: application/json'
          --data '{"text":"${{ github.actor }} created a pull request. Integration Verification Started"}'
          ${{ env.SLACK_WEBHOOK_URL }}
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run postgresql docker compose file
        run: docker compose up -d
      - name: Wait till docker psql is up
        run: |
          until docker compose exec -T db pg_isready -U vault-admin -d postgres; do
            echo "Waiting on database container"
            sleep 2
          done
      - name: Create database if not existing
        run: |
          docker compose exec -T db psql -U vault-admin -c "CREATE DATABASE vault_db;" || true
      - name: Maven Verify
        run: mvn -B -ntp clean verify
      - name: remove postgres service
        if: always()
        run: docker compose down
      - name: Announce Integration Success
        if: success()
        run: >
          curl -X POST -H 'Content-type: application/json'
          --data '{"text":"${{ github.actor }} pull request integration succeeded. Review Pull request on https://${{ github.action_repository }}/commit/${{ github.sha }}"}'
          ${{ env.SLACK_WEBHOOK_URL }}


